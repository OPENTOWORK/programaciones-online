workflows:
  ios-app-store:
    name: Training ProgLine iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: Codemagic Training ProgLine

    environment:
      node: lts
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.trainingprogline.app"
        APP_STORE_VERSION: "1.0.15"

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Generate native iOS project
        script: |
          npx expo prebuild --platform ios --clean

      - name: Detect Xcode workspace and scheme
        script: |
          set -e
          WORKSPACE=$(find "$CM_BUILD_DIR/ios" -maxdepth 1 -name "*.xcworkspace" -print -quit)
          if [ -z "$WORKSPACE" ]; then
            echo "No Xcode workspace found after Expo prebuild"
            exit 1
          fi

          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); schemes=d.get("workspace",{}).get("schemes",[]); print(schemes[0] if schemes else "")')
          if [ -z "$SCHEME" ]; then
            echo "No Xcode scheme found"
            exit 1
          fi

          echo "XCODE_WORKSPACE=$WORKSPACE" >> "$CM_ENV"
          echo "XCODE_SCHEME=$SCHEME" >> "$CM_ENV"
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Set iOS App Store version
        script: |
          cd ios
          agvtool new-marketing-version "$APP_STORE_VERSION"
          agvtool new-version -all "$CM_BUILD_NUMBER"

      - name: Set up keychain
        script: |
          keychain initialize

      - name: Fetch or create App Store signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add signing certificates to keychain
        script: |
          keychain add-certificates

      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
