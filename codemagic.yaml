workflows:
  ios-app-store:
    name: Training ProgLine iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: Codemagic Training ProgLine

    environment:
      groups:
        - code-signing
      node: lts
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.trainingprogline.app"
        APP_STORE_VERSION: "1.0"

    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm ci

      - name: Set iOS version for App Store build
        script: |
          set -e
          node <<'NODE'
          const fs = require('fs');
          const path = 'app.json';
          const app = JSON.parse(fs.readFileSync(path, 'utf8'));
          app.expo.version = process.env.APP_STORE_VERSION;
          app.expo.ios = app.expo.ios || {};
          app.expo.ios.bundleIdentifier = process.env.BUNDLE_ID;
          app.expo.ios.buildNumber = String(process.env.PROJECT_BUILD_NUMBER || process.env.BUILD_NUMBER || '1');
          fs.writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
          console.log(`iOS version: ${app.expo.version} (${app.expo.ios.buildNumber})`);
          console.log(`Bundle ID: ${app.expo.ios.bundleIdentifier}`);
          NODE

      - name: Generate native iOS project
        script: |
          set -e
          npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd ios
          pod install

      - name: Detect Xcode workspace and scheme
        script: |
          set -e
          WORKSPACE=$(find "$CM_BUILD_DIR/ios" -maxdepth 1 -name "*.xcworkspace" -print -quit)
          if [ -z "$WORKSPACE" ]; then
            echo "No Xcode workspace found after pod install"
            exit 1
          fi

          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); schemes=d.get("workspace",{}).get("schemes",[]); print(schemes[0] if schemes else "")')
          if [ -z "$SCHEME" ]; then
            echo "No Xcode scheme found"
            exit 1
          fi

          echo "XCODE_WORKSPACE=$WORKSPACE" >> "$CM_ENV"
          echo "XCODE_SCHEME=$SCHEME" >> "$CM_ENV"
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

      - name: Set up keychain
        script: |
          set -e
          keychain initialize

      - name: Fetch or create App Store signing files
        script: |
          set -e
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create

      - name: Add signing certificates to keychain
        script: |
          set -e
          keychain add-certificates

      - name: Apply provisioning profiles
        script: |
          set -e
          xcode-project use-profiles

      - name: Build IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
