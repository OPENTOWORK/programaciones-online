workflows:
  ios-app-store:
    name: Training ProgLine iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: Codemagic Training ProgLine

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.trainingprogline.app
      node: lts
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.trainingprogline.app"
        APP_STORE_VERSION: "1.0.15"

    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm ci

      - name: Set iOS version for App Store build
        script: |
          set -e
          node <<'NODE'
          const fs = require('fs');
          const path = 'app.json';
          const app = JSON.parse(fs.readFileSync(path, 'utf8'));
          app.expo.version = process.env.APP_STORE_VERSION;
          app.expo.ios = app.expo.ios || {};
          app.expo.ios.bundleIdentifier = process.env.BUNDLE_ID;
          app.expo.ios.buildNumber = String(process.env.PROJECT_BUILD_NUMBER || process.env.BUILD_NUMBER || '1');
          fs.writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
          console.log(`iOS version: ${app.expo.version} (${app.expo.ios.buildNumber})`);
          console.log(`Bundle ID: ${app.expo.ios.bundleIdentifier}`);
          NODE

      - name: Generate native iOS project
        script: |
          set -e
          npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd ios
          pod install

      - name: Detect the application Xcode workspace and scheme
        script: |
          set -e
          WORKSPACE=$(find "$CM_BUILD_DIR/ios" -maxdepth 1 -name "*.xcworkspace" -print -quit)
          if [ -z "$WORKSPACE" ]; then
            echo "No Xcode workspace found after pod install"
            exit 1
          fi

          # Expo names the application scheme after the generated workspace/project.
          # Do NOT take the first workspace scheme: CocoaPods schemes such as
          # EXApplication can appear first and produce a non-distributable archive.
          APP_SCHEME=$(basename "$WORKSPACE" .xcworkspace)

          AVAILABLE_SCHEMES=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(d.get("workspace",{}).get("schemes",[])))')
          echo "Available schemes:"
          printf '%s\n' "$AVAILABLE_SCHEMES"

          if ! printf '%s\n' "$AVAILABLE_SCHEMES" | grep -Fxq "$APP_SCHEME"; then
            echo "Expected application scheme '$APP_SCHEME' was not found."
            exit 1
          fi

          echo "XCODE_WORKSPACE=$WORKSPACE" >> "$CM_ENV"
          echo "XCODE_SCHEME=$APP_SCHEME" >> "$CM_ENV"
          echo "Workspace: $WORKSPACE"
          echo "Application scheme: $APP_SCHEME"

      - name: Apply App Store provisioning profile
        script: |
          set -e
          xcode-project use-profiles --archive-method=app-store

      - name: Build IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
