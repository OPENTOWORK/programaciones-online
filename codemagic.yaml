# Tres flujos de iOS:
#   ios-development  · pull requests a main: tests y compilación para simulador, sin firma ni publicación.
#   ios-testflight   · push a main: IPA firmado y subido a TestFlight. Nunca se envía a revisión.
#   ios-app-store    · solo manual (Start new build): envía a revisión de App Store; la publicación
#                      sigue siendo manual en App Store Connect cuando Apple la apruebe.
# La versión pública sale de app.json (expo.version); el número de build lo calcula Codemagic.

definitions:
  environment:
    ios_tools: &ios_tools
      node: lts
      xcode: latest
      cocoapods: default
    ios_vars: &ios_vars
      BUNDLE_ID: "com.trainingprogline.app"
      APP_APPLE_ID: "6810687197"
    ios_signing: &ios_signing
      distribution_type: app_store
      bundle_identifier: com.trainingprogline.app

  scripts:
    - &install_dependencies
      name: Install dependencies
      script: |
        set -e
        npm ci

    - &unit_tests
      name: Unit tests
      script: |
        set -e
        npm test

    - &set_build_number
      name: Set iOS build number
      script: |
        set -e
        # Siguiente al build más alto de TestFlight (cualquier versión) y nunca por debajo del contador de Codemagic.
        LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" --all-versions 2>/dev/null | tail -n 1 | tr -cd '0-9' || true)
        NEXT=$(( ${LATEST:-0} + 1 ))
        if [ "$NEXT" -lt "${PROJECT_BUILD_NUMBER:-0}" ]; then NEXT=$PROJECT_BUILD_NUMBER; fi
        IOS_BUILD_NUMBER=$NEXT node <<'NODE'
        const fs = require('fs');
        const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
        if (app.expo.ios?.bundleIdentifier !== process.env.BUNDLE_ID) {
          console.error(`app.json tiene ${app.expo.ios?.bundleIdentifier}; se esperaba ${process.env.BUNDLE_ID}`);
          process.exit(1);
        }
        app.expo.ios.buildNumber = process.env.IOS_BUILD_NUMBER;
        fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
        console.log(`iOS ${app.expo.version} (${app.expo.ios.buildNumber}) · ${app.expo.ios.bundleIdentifier}`);
        NODE

    - &generate_ios_project
      name: Generate native iOS project
      script: |
        set -e
        npx expo prebuild --platform ios --clean --no-install

    - &install_pods
      name: Install CocoaPods dependencies
      script: |
        set -e
        cd ios
        pod install

    - &detect_workspace
      name: Detect the application Xcode workspace and scheme
      script: |
        set -e
        WORKSPACE=$(find "$CM_BUILD_DIR/ios" -maxdepth 1 -name "*.xcworkspace" -print -quit)
        if [ -z "$WORKSPACE" ]; then
          echo "No Xcode workspace found after pod install"
          exit 1
        fi

        # Expo names the application scheme after the generated workspace/project.
        # Do NOT take the first workspace scheme: CocoaPods schemes such as
        # EXApplication can appear first and produce a non-distributable archive.
        APP_SCHEME=$(basename "$WORKSPACE" .xcworkspace)

        AVAILABLE_SCHEMES=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(d.get("workspace",{}).get("schemes",[])))')
        echo "Available schemes:"
        printf '%s\n' "$AVAILABLE_SCHEMES"

        if ! printf '%s\n' "$AVAILABLE_SCHEMES" | grep -Fxq "$APP_SCHEME"; then
          echo "Expected application scheme '$APP_SCHEME' was not found."
          exit 1
        fi

        echo "XCODE_WORKSPACE=$WORKSPACE" >> "$CM_ENV"
        echo "XCODE_SCHEME=$APP_SCHEME" >> "$CM_ENV"
        echo "Workspace: $WORKSPACE"
        echo "Application scheme: $APP_SCHEME"

    - &apply_profiles
      name: Apply App Store provisioning profile
      script: |
        set -e
        xcode-project use-profiles --archive-method=app-store

    - &build_ipa
      name: Build IPA
      script: |
        set -e
        xcode-project build-ipa \
          --workspace "$XCODE_WORKSPACE" \
          --scheme "$XCODE_SCHEME"

  artifacts: &ios_artifacts
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log
    - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

workflows:
  ios-development:
    name: Training ProgLine iOS desarrollo (simulador)
    instance_type: mac_mini_m2
    max_build_duration: 90
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: false
    environment:
      <<: *ios_tools
      vars:
        <<: *ios_vars
    scripts:
      - *install_dependencies
      - *unit_tests
      - *generate_ios_project
      - *install_pods
      - *detect_workspace
      - name: Build for iOS Simulator (Release, sin firma)
        script: |
          set -e
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios/simulator \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build
    artifacts:
      - build/ios/simulator/Build/Products/Release-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: Training ProgLine iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    integrations:
      app_store_connect: Codemagic Training ProgLine
    environment:
      ios_signing: *ios_signing
      <<: *ios_tools
      vars:
        <<: *ios_vars
    scripts:
      - *install_dependencies
      - *unit_tests
      - *set_build_number
      - *generate_ios_project
      - *install_pods
      - *detect_workspace
      - *apply_profiles
      - *build_ipa
    artifacts: *ios_artifacts
    publishing:
      app_store_connect:
        auth: integration
        # Los testers internos reciben el build en cuanto Apple lo procesa. Para testers
        # externos, añade beta_groups y submit_to_testflight: true (revisión beta, no de tienda).
        submit_to_testflight: false
        submit_to_app_store: false

  ios-app-store:
    name: Training ProgLine iOS App Store (solo manual)
    instance_type: mac_mini_m2
    max_build_duration: 120
    # Sin triggering: solo se lanza a mano desde Codemagic, tras validar la versión en TestFlight.
    integrations:
      app_store_connect: Codemagic Training ProgLine
    environment:
      ios_signing: *ios_signing
      <<: *ios_tools
      vars:
        <<: *ios_vars
    scripts:
      - *install_dependencies
      - *unit_tests
      - *set_build_number
      - *generate_ios_project
      - *install_pods
      - *detect_workspace
      - *apply_profiles
      - *build_ipa
    artifacts: *ios_artifacts
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true
        cancel_previous_submissions: true
        # Apple aprueba, pero la versión no sale a la tienda hasta pulsar «Publicar» en App Store Connect.
        release_type: MANUAL
